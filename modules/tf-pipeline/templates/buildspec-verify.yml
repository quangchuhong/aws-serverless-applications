version: 0.2

# Doc lai AWS sau khi MOI stage cua pipeline da apply xong.
#
# Bien do codebuild.tf dat:
#   VERIFY_CMD  lenh chay, tu GOC REPO
#   PIPELINE    ten pipeline - de script doc lai log cua chinh lan chay nay
#   LOG_GROUP   log group cua cac build trong pipeline do
#
# ======================================================================
# KHONG CAI TERRAFORM, KHONG DOC STATE, KHONG KEO tfvars
#
# Ba dieu do la thiet ke, khong phai toi gian hoa.
#
# Mot phep verify doc state se tra loi dung cau hoi ma state da tra loi
# roi - va do la cau hoi SAI. `terraform output tag_policy` in
# enabled = true nghia la Terraform DA GOI CreatePolicy va AWS tra ve
# 200; no khong noi policy gan vao dau, hay no co CHAN gi khong.
#
# Loi 121: moi apply xanh trong ba thang deu la no-op, nen "pipeline chay
# on" chua bao gio co nghia la "apply duoc".
# Loi 126: mot SCP go sai ten action van apply thanh cong, van nam trong
# policy, va chan dung 0 thu.
#
# Ca hai chi do duoc bang mot cau hoi gui THANG toi AWS.
#
# ======================================================================
# DANH TINH: CUA CODEBUILD, O ACCOUNT MANAGEMENT
#
# Khac Plan/Apply - chung truyen ASSUME_ROLE_ARN cho provider Terraform.
# O day khong co provider nao; script goi AWS CLI truc tiep.
#
# Du cho layer organization: Organizations CHI tra loi tu account
# management, va goi tu account khac tra ve rong hoac AccessDenied - thu
# ma mot script doc hong se bien thanh "khong co gi sai".

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail
        echo "== Danh tinh CodeBuild"
        aws sts get-caller-identity --query '[Account,Arn]' --output text

  build:
    commands:
      # ------------------------------------------------------
      # VERIFY_CMD RONG LA MOT LOI, KHONG PHAI "KHONG CO GI DE LAM"
      #
      # Stage nay chi duoc sinh khi var.verify khac rong (xem
      # pipeline.tf), nen rong o day nghia la bien khong den duoc
      # CodeBuild - va luc do mot lan chay "thanh cong" se chung minh
      # dung mot dieu: khong co gi duoc kiem.
      #
      # DAU NHAY DON o cac dong echo: trong nhay doi, backtick la command
      # substitution - bash se di TIM mot lenh ten "verify".
      # ------------------------------------------------------
      - |
        set -euo pipefail

        if [ -z "${VERIFY_CMD:-}" ]; then
          echo 'LOI: VERIFY_CMD rong.'
          echo '     Stage nay chi duoc sinh khi var.verify khac rong, nen rong'
          echo '     nghia la bien khong den duoc CodeBuild. Mot lan chay xanh o'
          echo '     day se chung minh dung mot dieu: khong co gi duoc kiem.'
          exit 1
        fi

        cd "${CODEBUILD_SRC_DIR}"
        echo "== Verify: ${VERIFY_CMD}"

        # ----------------------------------------------------
        # FILE KHONG CO TRONG ARTIFACT NGUON - NOI RO NGUYEN NHAN
        #
        # Khong co khoi nay thi bash chi in
        #
        #   ./landing-zone/organization/kiem-to-chuc.sh: No such file or
        #   directory
        #   exit status 127
        #
        # va dong do doc y het mot ten file GO SAI. Nguyen nhan thuong gap
        # hon han thi khac: pipeline doc tu CODECOMMIT, con file moi thi
        # dang o GitHub va chua duoc mirror. Da xay ra dung nhu vay o lan
        # chay dau cua stage nay.
        #
        # Hai nguyen nhan, hai cach chua hoan toan khac nhau - nen thong
        # bao phai neu ca hai chu khong de nguoi doc tu doan.
        # ----------------------------------------------------
        SCRIPT="${VERIFY_CMD%% *}"
        if [ ! -f "$SCRIPT" ]; then
          echo
          echo "LOI: khong thay $SCRIPT trong artifact nguon."
          echo
          echo "     Thu muc goc cua artifact: $(pwd)"
          echo "     Commit dang build: ${CODEBUILD_RESOLVED_SOURCE_VERSION:-khong biet}"
          echo
          echo "     HAI nguyen nhan, hai cach chua:"
          echo
          echo "     1. File CHUA duoc day len nhanh ma pipeline doc."
          echo "        Pipeline doc tu CodeCommit; mot commit chi nam o GitHub"
          echo "        thi voi pipeline la KHONG TON TAI."
          echo "          git push codecommit HEAD:main"
          echo
          echo "     2. Duong dan trong var.verify go sai."
          echo "        Duong dan tinh tu GOC REPO, khong tu thu muc layer."
          exit 1
        fi
        if [ ! -x "$SCRIPT" ]; then
          echo
          echo "LOI: $SCRIPT co trong artifact nhung KHONG co quyen chay."
          echo "     git giu bit nay: chmod +x roi commit lai."
          exit 1
        fi
        echo

        # ----------------------------------------------------
        # eval, va vi sao khong phai mot mang lenh
        #
        # VERIFY_CMD den tu Terraform duoi dang MOT chuoi, co the mang co.
        # Chay no truc tiep thi ca chuoi bi coi la mot ten file.
        #
        # An toan o day vi nguon cua chuoi la code da qua review, khong
        # phai dau vao cua nguoi dung.
        # ----------------------------------------------------
        set +e
        eval "${VERIFY_CMD}"
        RC_LAYER=$?
        set -e

        # ----------------------------------------------------
        # PHEP KIEM LOG - CHUNG CHO MOI PIPELINE, CHAY LUON
        #
        # Vi sao o day chu khong trong lenh verify cua tung pipeline: phep
        # kiem nay khong biet gi ve layer nao ca, no chi doc log cua lan
        # chay. Dat no vao tung lenh verify se cho ra ba ban roi bon ban,
        # va ban lech se la ban LONG hon - vi khong ai sua mot phep kiem
        # de no keu minh nhieu hon. Cung ly do gate.py chi co mot ban.
        #
        # CHAY CA KHI LENH TRUOC DA DO: neu lenh verify cua layer that
        # bai, log cua lan chay la dung cai giup hieu VI SAO. Bo qua no o
        # dung luc can nhat la mot thiet ke sai.
        #
        # Ma thoat: hong o ben nao cung lam ca stage do.
        # ----------------------------------------------------
        set +e
        "${CODEBUILD_SRC_DIR}/landing-zone/ops-gate/kiem-log.sh"
        RC_LOG=$?
        set -e

        echo
        echo "== ket qua: layer=$RC_LAYER  log=$RC_LOG"
        if [ "$RC_LAYER" -ne 0 ] || [ "$RC_LOG" -ne 0 ]; then
          exit 1
        fi
