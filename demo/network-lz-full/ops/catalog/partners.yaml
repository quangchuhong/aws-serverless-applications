# ==============================================================
# HO SO DOI TAC - doc 16 muc 10.1
#
# File nay KHONG dung duong ham. Ha tang VPN nam o layer cha
# (../../partner.tf) va doi vai thang mot lan.
#
# Cai doi HANG NGAY la: doi tac nao duoc goi app nao, cong nao, den
# bao gio. Do la thu file nay quan.
#
# --------------------------------------------------------------
# NO SINH RA CAI GI
#
# Moi doi tac o day thanh mot APP giai duoc trong firewall-rules.yaml,
# ten dat theo dang "partner-<ten>":
#
#     partners:
#       - name: acme
#         ...
#
#     # roi trong firewall-rules.yaml:
#     - id: fw-0020
#       from: partner-acme          <- giai thanh dai NLB cua 3rd-party VPC
#       to: app-prod
#       ports: [80]
#
# Vi sao "from" la dai NLB chu khong phai dai cua doi tac: goi tin cua
# doi tac DUNG LAI o NLB trong 3rd-party VPC, va NLB mo mot ket noi
# MOI toi spoke. Firewall nhin thay nguon la NLB, khong phai 172.16.x.
#
# Khai rule tro tu dai that cua doi tac se apply thanh cong va khong
# khop mot goi tin nao - dung kieu im lang ma ca lop nay sinh ra de
# tranh. lint.sh chan truong hop do.
#
# --------------------------------------------------------------
# expires LA HOP DONG, KHONG PHAI GHI CHU
#
# Ket noi doi tac gan nhu luon co ngay ket thuc - het hop dong, het du
# an, doi tac doi thiet bi. Truong nay lam ngay do hien ra:
#
#   - lint.sh thoat khac 0 khi qua han
#   - job expiry trong CI do moi ngay, ke ca khi khong ai sua gi
#
# Rule KHONG tu bien mat. Go la mot commit co nguoi duyet - vi cat
# duong cua doi tac luc nua dem la mot cuoc goi dien luc nua dem.
#
# --------------------------------------------------------------
# TRUONG
#
#   name       BAT BUOC  chu thuong, so, gach ngang. Thanh "partner-<name>"
#   remote_cidr BAT BUOC dai doi tac cong bo cho ban. Khop voi
#                        partner_sim_cidr (hoac CGW that) o layer cha
#   contact    NEN CO    email/kenh lien he ky thuat phia doi tac
#   ticket     NEN CO    hop dong hoac ticket phe duyet
#   expires              YYYY-MM-DD - ngay het hop dong
#   note                 mot cau tieng nguoi
#   extra_cidrs          dai PHU doi tac cong bo them (danh sach).
#                        Moi dai thanh mot route tinh tren VPN.
#                        KHONG lap lai remote_cidr - layer cha da so
#                        huu route do
#   services             danh sach dich vu ban CONG BO cho ho, xem duoi
#
# --------------------------------------------------------------
# services - CUA MO RA NGOAI
#
# Moi muc sinh ra mot target group + mot listener tren NLB cua doi
# tac. Do la thu doi tac THAT SU cham vao - go no di la dong cua ngay
# lap tuc, ke ca khi rule firewall van con.
#
#   name       BAT BUOC  ten ngan. Ghep thanh "<doi tac>-<name>", va
#                        chuoi do di vao ten target group (AWS gioi
#                        han 32 ky tu ca tien to project)
#   port       BAT BUOC  cong DOI TAC GOI VAO tren NLB. DUY NHAT trong
#                        CA file nay - mot NLB chi cho mot listener moi
#                        cong, ke ca giua hai doi tac khac nhau
#   target_port          cong UNG DUNG THAT SU NGHE. Mac dinh = port.
#                        KHONG can duy nhat - hai dich vu tro toi cung
#                        mot ung dung la binh thuong
#   target     BAT BUOC  ten app trong apps.yaml. App do phai giai ra
#                        MOT dia chi (cidr dang x.x.x.x/32) vi NLB can
#                        mot dia chi, khong phai mot dai
#   target_ip            loi thoat: khai thang dia chi, khi dich khong
#                        phai mot app trong catalog
#   ticket / expires     ke thua tu ho so doi tac neu khong khai rieng
#
# CONG NAO DUOC DUNG: bat cu cong nao TRU cong layer cha da chiem
# (ops_handles.partner.reserved_port, mac dinh 80). Cham vao no thi
# plan dung - chu khong phai apply hong o giua.
#
# --------------------------------------------------------------
# HAI CONG, VA RULE FIREWALL MO CAI THU HAI
#
# Doi tac goi vao NLB o `port`. NLB dung ket noi do lai va mo mot ket
# noi MOI toi ung dung o `target_port`. Firewall nam tren duong thu
# hai, nen:
#
#     rule firewall phai mo target_port, KHONG PHAI port
#
# Go nham thi rule apply thanh cong va khong khop goi tin nao - dung
# kieu im lang ma ca lop nay sinh ra de tranh. lint.sh nhac khi hai
# cong khac nhau.
#
# Cung ly do do, `from` la partner-<ten> (dai NLB) chu khong phai dai
# that cua doi tac.
#
# --------------------------------------------------------------
# HAI LOP, HAI CAU HOI
#
#   listener (file nay)          doi tac GOI DUOC toi dau
#   rule firewall                goi tin co DI TIEP toi spoke khong
#
# Go mot trong hai la du de cat duong. Giu ca hai de mot sai sot o
# mot lop khong tu no mo duong.
#
# CIDR ban cong bo cho ho KHONG khai o day - no do layer cha quyet
# dinh (dai NLB + dai NAT) va lop nay doc tu ops_handles. Khai lai o
# hai cho la hai cho co the lech nhau.
# ==============================================================

#partners: []

partners:
  - name: sim
    remote_cidr: 172.16.0.0/16
    contact: netops@noi-bo
    ticket: DEMO-1
    expires: 2026-12-31
    services:
      - name: api
        port: 8080          # đối tác gọi vào
        target_port: 80     # ứng dụng thật sự nghe
        target: app-dev-web

