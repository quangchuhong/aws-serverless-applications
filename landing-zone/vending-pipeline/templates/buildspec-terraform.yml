version: 0.2

# ==============================================================
# MOT BUILDSPEC CHO CA plan LAN apply
#
# TF_ACTION quyet dinh chay cai nao. Mot file thay vi hai, vi phan
# chuan bi - sinh backend.tf, init, chon danh tinh - PHAI giong het
# nhau o hai lan chay. Hai file thi mot ngay nao do chung se lech, va
# lech o buoc chuan bi nghia la apply mot ke hoach tinh tren mot
# backend khac.
# ==============================================================

env:
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "0"
    # Mau ANSI trong log CodePipeline la rac. Plan van doc duoc.
    TF_CLI_ARGS: "-no-color"

phases:
  install:
    commands:
      - |
        set -euo pipefail
        echo "== Cai Terraform ${TF_VERSION}"
        curl -fsSL -o /tmp/tf.zip \
          "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
        unzip -q -o /tmp/tf.zip -d /usr/local/bin
        terraform version

  pre_build:
    commands:
      - |
        set -euo pipefail
        echo "== Danh tinh CodeBuild"
        aws sts get-caller-identity --query '[Account,Arn]' --output text

        # ------------------------------------------------------
        # DANH TINH TAO RESOURCE
        #
        # KHONG assume role o day. Layer network nhan
        # var.assume_role_arn va tu assume trong provider block, nen
        # BACKEND giu credential cua CodeBuild (doc duoc bucket state
        # o management) con PROVIDER nhay sang account mang.
        #
        # Assume o day thi ca hai cung nhay, va CodeBuild mat quyen
        # doc state - hoac te hon, doc duoc mot state khac.
        # ------------------------------------------------------
        if [ -n "${ASSUME_ROLE_ARN:-}" ]; then
          echo "   provider se assume: ${ASSUME_ROLE_ARN}"
          export TF_VAR_assume_role_arn="${ASSUME_ROLE_ARN}"
        fi

  build:
    commands:
      - |
        set -euo pipefail

        # ------------------------------------------------------
        # DUONG DAN TUYET DOI - KHONG DUOC DUNG `cd "${LAYER_DIR}"`
        #
        # CodeBuild chay MOI lenh trong CUNG mot shell, nen thu muc
        # hien tai giu nguyen giua cac khoi `- |`. Khoi thu hai ma
        # `cd` bang duong dan tuong doi lan nua se tim
        # landing-zone/account-baseline/landing-zone/account-baseline
        # va chet - sau khi init da chay xong, nen log doc nhu la
        # plan hong chu khong phai cd hong.
        # ------------------------------------------------------
        cd "${CODEBUILD_SRC_DIR}/${LAYER_DIR}"
        echo "== Layer: ${LAYER_DIR}"

        # ------------------------------------------------------
        # KEO terraform.tfvars VE - BUOC KHONG BO DUOC
        #
        # tfvars nam trong .gitignore (chua account ID, email), nen
        # ban checkout KHONG CO no.
        #
        # Va thieu no KHONG gay loi: ba trong bon layer khong co bien
        # bat buoc nao - moi bien deu co `default`. `terraform plan`
        # se chay THANH CONG voi catalog = {}, spokes = {}, ou_ids =
        # {} tren DUNG state that, tuc mo ta viec XOA moi thu dang co.
        #
        # Nen thieu file la LOI CUNG o day.
        # ------------------------------------------------------
        TFVARS_KEY="tfvars/${LAYER_DIR}/terraform.tfvars"
        echo "== tfvars  (s3://${TFVARS_BUCKET}/${TFVARS_KEY})"

        set +e
        ERR=$(aws s3api get-object \
                --bucket "${TFVARS_BUCKET}" \
                --key "${TFVARS_KEY}" \
                terraform.tfvars 2>&1 >/dev/null)
        RC=$?
        set -e

        if [ "$RC" -ne 0 ]; then
          echo "LOI: khong lay duoc terraform.tfvars cho ${LAYER_DIR}."
          echo ""
          echo "AWS tra ve:"
          echo "  $ERR"
          echo ""
          echo "Ba nguyen nhan hay gap:"
          echo "  1. Chua day file len:  ./push-tfvars.sh  (o landing-zone/vending-pipeline)"
          echo "  2. Day len sai khoa. Khoa dung: ${TFVARS_KEY}"
          echo "  3. Role CodeBuild thieu s3:GetObject tren bucket ${TFVARS_BUCKET}"
          echo ""
          echo "KHONG chay plan khi thieu file nay: ba trong bon layer khong co"
          echo "bien bat buoc, nen plan se THANH CONG va mo ta viec xoa moi thu."
          exit 1
        fi

        if [ ! -s terraform.tfvars ]; then
          echo "LOI: terraform.tfvars tai ve nhung RONG (0 byte)."
          echo "     Day lai bang ./push-tfvars.sh"
          exit 1
        fi

        echo "   $(wc -l < terraform.tfvars) dong"

        # ------------------------------------------------------
        # SINH backend.tf - BUOC KHONG BO DUOC
        #
        # backend.tf va backend.hcl nam trong .gitignore: chung do
        # wire-backends.sh sinh ra tren may tung nguoi. Nen ban
        # checkout o day KHONG CO khoi backend nao.
        #
        # Thieu buoc nay thi terraform init cau hinh backend LOCAL -
        # mot state RONG - va plan bao can tao moi toan bo ha tang.
        # Khong co loi nao ca. Nguoi duyet nhin "200 to add" co the
        # tuong day la mot moi truong moi.
        # ------------------------------------------------------
        cat > backend.tf <<'TFBACKEND'
        terraform {
          backend "s3" {}
        }
        TFBACKEND

        BACKEND_ARGS="-backend-config=bucket=${STATE_BUCKET}"
        BACKEND_ARGS="$BACKEND_ARGS -backend-config=key=${STATE_KEY}"
        BACKEND_ARGS="$BACKEND_ARGS -backend-config=region=${STATE_REGION}"
        BACKEND_ARGS="$BACKEND_ARGS -backend-config=encrypt=true"
        if [ -n "${STATE_LOCK_TABLE:-}" ]; then
          BACKEND_ARGS="$BACKEND_ARGS -backend-config=dynamodb_table=${STATE_LOCK_TABLE}"
        fi

        echo "== init  (key: ${STATE_KEY})"
        terraform init -input=false $BACKEND_ARGS

        # ------------------------------------------------------
        # KHONG DE STATE RONG DI TIEP
        #
        # Sai khoa, hoac backend.tf sinh hong, deu cho ra mot state
        # rong - va plan tren state rong thi HOP LE, chi la no mo ta
        # viec dung lai tu dau. Dung o day thay vi de mot cong duyet
        # phai bat.
        #
        # Layer chua bao gio apply thi dat FIRST_APPLY=yes.
        # ------------------------------------------------------
        N=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')
        echo "   $N resource trong state"
        if [ "$N" = "0" ] && [ "${FIRST_APPLY:-no}" != "yes" ]; then
          echo "LOI: state RONG cho ${LAYER_DIR}."
          echo "     Khoa dang dung: ${STATE_KEY}"
          echo "     Layer nay da tung apply, nen state rong nghia la SAI KHOA"
          echo "     hoac backend chua duoc cau hinh - khong phai lan chay dau."
          echo "     Doi chieu: cd landing-zone/tf-backend && terraform output layers"
          exit 1
        fi

      - |
        set -euo pipefail
        # Tuyet doi, cung ly do voi khoi tren.
        cd "${CODEBUILD_SRC_DIR}/${LAYER_DIR}"

        # ------------------------------------------------------
        # -target: CO CHU DICH, KHONG PHAI DUONG TAT
        #
        # Stage A va stage C la CUNG mot layer
        # (landing-zone/account-baseline). Khong gioi han thi
        # `terraform apply` cua stage A tao LUON spoke_network - truoc
        # khi stage B kip chia se TGW - va stack o account dich cho
        # mot loi moi RAM chua duoc gui, het gio, rollback.
        #
        # Day la mot rang buoc thu tu THAT giua hai layer, khong phai
        # mot lan chay nham. Do la truong hop -target sinh ra de giai
        # quyet.
        #
        # Terraform se in canh bao rang plan nay khong day du. Canh
        # bao do DUNG va nen de nguyen: nguoi duyet stage A can thay
        # ro no chi tao account.
        # ------------------------------------------------------
        TARGET_ARGS=""
        for t in ${TF_TARGETS:-}; do
          TARGET_ARGS="$TARGET_ARGS -target=$t"
        done
        # if/fi chu khong phai `[ ... ] && echo`: duoi `set -e`, mot
        # test SAI lam ca bieu thuc tra ve 1 va giet script - o day la
        # giet no o truong hop BINH THUONG nhat, khi khong co target.
        if [ -n "$TARGET_ARGS" ]; then
          echo "== gioi han:$TARGET_ARGS"
        fi

        if [ "${TF_ACTION}" = "plan" ]; then
          echo "== plan"
          # -out: apply se dung DUNG ke hoach nay, khong tinh lai.
          #
          # Giua luc duyet va luc apply co the vai gio. Khong co -out
          # thi apply tinh mot plan MOI, va thu nguoi ta bam duyet
          # khong con la thu duoc thuc hien. Cong duyet luc do la
          # nghi thuc, khong phai kiem soat.
          set +e
          terraform plan -input=false -detailed-exitcode $TARGET_ARGS -out=tfplan
          CODE=$?
          set -e

          # -detailed-exitcode: 0 = khong doi gi, 2 = co thay doi,
          # 1 = loi. Phan biet duoc "khong co gi de lam" voi "hong"
          # la thu khien mot pipeline chay hang ngay doc duoc.
          case "$CODE" in
            0) echo "KHONG CO THAY DOI"; echo "no-changes" > .tf-verdict ;;
            2) echo "CO THAY DOI";       echo "changes"    > .tf-verdict ;;
            *) echo "PLAN HONG";         exit "$CODE" ;;
          esac

          # Ban doc duoc, de dinh kem vao thu duyet.
          terraform show -no-color tfplan > tfplan.txt

          # ----------------------------------------------------
          # DEM THEO `will be ...`, KHONG THEO DONG `Plan:`
          #
          # `terraform show <file plan>` KHONG in dong
          # "Plan: N to add, ...". Dong do do `terraform plan` in ra
          # man hinh, khong nam trong ban show.
          #
          # Ban dau cho nay grep '^Plan:' tren tfplan.txt. Hau qua
          # khong phai mat mot dong tom tat - ma la khoi `if` ben
          # duoi KHONG BAO GIO dung, nen canh bao "co resource bi
          # xoa" chua tung chay mot lan nao, ke ca khi plan doi xoa
          # sach ha tang. Mot lop chan cuoi truoc cong duyet, chet im
          # lang tu ngay dau.
          # ----------------------------------------------------
          TAO=$(grep -c 'will be created' tfplan.txt || true)
          SUA=$(grep -c 'will be updated in-place' tfplan.txt || true)
          XOA=$(grep -c 'will be destroyed' tfplan.txt || true)
          THAY=$(grep -c 'must be replaced' tfplan.txt || true)

          echo "== tom tat: ${TAO} tao, ${SUA} sua, ${XOA} xoa, ${THAY} thay the"

          # THAY THE dem ngang XOA: mot stack instance bi thay the la
          # stack o account dich bi xoa roi dung lai - VPC, subnet,
          # attachment deu ID moi.
          if [ "$XOA" != "0" ] || [ "$THAY" != "0" ]; then
            echo ""
            echo "!!! PLAN NAY XOA ${XOA} VA THAY THE ${THAY} RESOURCE"
            echo "!!! Pipeline nay sinh ra de THEM account. Doc ky truoc khi duyet:"
            grep -E 'will be destroyed|must be replaced' tfplan.txt | sed 's/^/    /'
          fi
        else
          echo "== apply"
          if [ ! -f tfplan ]; then
            echo "LOI: khong thay file tfplan."
            echo "     Stage apply phai nhan artifact tu stage plan cua CHINH no."
            exit 1
          fi
          terraform apply -input=false tfplan

          # ----------------------------------------------------
          # SAU MOT APPLY CO -target: GHI LAI OUTPUT
          #
          # `terraform apply <file plan>` chi thuc hien dung plan da
          # luu. Voi `-target`, Terraform loai output khoi plan tru khi
          # chung phu thuoc vao resource duoc target - va ket qua la
          # state co resource MOI nhung output CU.
          #
          # Do la thu da lam hong lan chay 10/09: stage A tao hai
          # account, nhung `vending_handles.tgw_share` trong state van
          # la danh sach 4 account. Stage B doc state do qua
          # terraform_remote_state, thay 4, va bao KHONG CO THAY DOI -
          # nen TGW khong duoc chia se cho hai account moi. Stage C
          # dung stack o do, `NhanRam` cho 240 giay mot loi moi chua ai
          # gui, roi bao het gio.
          #
          # Chuoi nhan qua dai ba stage: nguyen nhan o A, trieu chung o
          # C, va khong co gi noi rang chung lien quan.
          #
          # `-refresh-only` KHONG doi ha tang - no chi doc lai thuc te
          # va ghi state, ke ca output. Chi chay khi CO target, vi apply
          # khong target da cap nhat output day du.
          # ----------------------------------------------------
          if [ -n "$TARGET_ARGS" ]; then
            echo "== ghi lai output (sau apply co -target)"
            terraform apply -refresh-only -input=false -auto-approve
          fi
        fi

artifacts:
  # Ca cay nguon, ke ca file `tfplan` ma stage apply se chay.
  #
  # `**/*` KHONG khop thu muc an, nen `.terraform/` (provider da tai)
  # KHONG di theo artifact. Do khong phai thieu sot: khoi lenh thu
  # nhat chay cho CA plan lan apply - no sinh lai backend.tf, keo lai
  # tfvars va `terraform init` lai - nen stage apply tu cai provider
  # theo dung .terraform.lock.hcl (file nay CO trong git voi
  # landing-zone/*).
  #
  # Dung them "**/.terraform/**/*" vao day: hang tram MB binary di qua
  # S3 moi lan chay, de doi lay dung cai `init` da lam trong 10 giay.
  files:
    - "**/*"
