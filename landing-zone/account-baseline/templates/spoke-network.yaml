AWSTemplateFormatVersion: "2010-09-09"

# ==============================================================
# MANG NEN CHO MOT ACCOUNT WORKLOAD
#
# Trien khai qua StackSet tu management account, mot stack instance
# cho moi account co khoi `network` trong catalog.
#
# VI SAO LA CLOUDFORMATION CHU KHONG PHAI TERRAFORM
#
# Terraform can MOT PROVIDER ALIAS cho moi account, va provider
# KHONG SINH DONG DUOC bang for_each. 20 account la 20 alias viet
# tay, va account thu 21 la mot lan sua code.
#
# StackSet thi nhan danh sach account nhu du lieu. Do la ly do duy
# nhat, va no du lon.
#
# --------------------------------------------------------------
# CHIA SUBNET - doc 17 muc 3
#
# VPC /16 chia thanh 4 dai /24 bang Fn::Cidr:
#
#   0  private-a   ung dung
#   1  private-b   ung dung
#   2  tgw-a       CHI cho ENI cua TGW attachment
#   3  tgw-b
#
# Subnet TGW rieng, KHONG dung chung voi subnet ung dung: ENI cua
# attachment nam trong subnet nao thi luu luong vao/ra VPC di qua AZ
# do. Tron chung thi mot ACL hay mot route sua cho ung dung se doi
# ca duong cua TGW - va trieu chung la mot AZ mat ket noi trong khi
# AZ kia binh thuong.
#
# Con /16 nguyen ven cho viec mo rong: 4 dai dau dung het 10.x.0-3,
# con lai 10.x.4 den 10.x.255.
# ==============================================================

Description: LZ account baseline - mang nen cho account workload

Parameters:
  ProjectName:
    Type: String
  AccountName:
    Type: String
  VpcCidr:
    Type: String
    AllowedPattern: '^10\.\d{1,3}\.0\.0/16$'
    ConstraintDescription: Phai la mot dai 10.x.0.0/16 theo bang cap phat o doc 17
  AzA:
    Type: AWS::EC2::AvailabilityZone::Name
  AzB:
    Type: AWS::EC2::AvailabilityZone::Name
  TransitGatewayId:
    Type: String
    Default: ""
  DnsProfileId:
    Type: String
    Default: ""
  InternalSupernet:
    Type: String
    Default: 10.0.0.0/8
  AttachTgw:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

  # Ten resource share duoc phep NHAN tu dong, cach nhau bang dau
  # phay. De rong = nhan MOI loi moi dang cho.
  #
  # Nen khai ten: mot account trong to chuc co the nhan loi moi tu
  # bat ky ai da duoc phep chia se toi no, va "nhan het" bien stack
  # nay thanh mot cai bam-dong-y-tat-ca.
  RamShareNames:
    Type: String
    Default: ""

  # Cho toi da bao lau de TGW nhin thay duoc trong account nay.
  # Phai NHO HON Timeout cua RamFn (600).
  RamWaitSeconds:
    Type: String
    Default: "240"

Conditions:
  # Noi TGW can CA hai: nguoi ta muon noi, VA co TGW de noi. Thieu ve
  # thu hai ma van tao attachment thi stack hong o giua voi mot loi
  # noi ve mot ID rong.
  DoAttach: !And
    - !Equals [!Ref AttachTgw, "true"]
    - !Not [!Equals [!Ref TransitGatewayId, ""]]

  # DNS tap trung chi gan duoc khi profile da duoc share sang account
  # nay. Chua share thi bo qua - VPC van dung duoc, chi la khong phan
  # giai duoc ten noi bo.
  DoDns: !Not [!Equals [!Ref DnsProfileId, ""]]

  # Can cho RAM khi stack nay dung BAT KY tai nguyen nao duoc chia se
  # tu account mang - TGW, DNS profile, hoac ca hai.
  #
  # Ban dau khoi RAM chi gan dieu kien DoAttach, va chi `Attachment`
  # khai DependsOn. `DnsProfile` khong phu thuoc gi nen CloudFormation
  # tao no SONG SONG - truoc khi loi moi kip duoc nhan - va stack hong
  # voi "[RSLVR-05007] Can't find the resource with ID rp-...".
  # Cau do khong nhac gi toi RAM, y het cau ve Transit Gateway ma ca
  # co che nay duoc viet ra de tranh.
  DoRam: !Or [Condition: DoAttach, Condition: DoDns]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${AccountName}-vpc"

  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${AccountName}-private-a"
        - Key: Tier
          Value: private

  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${AccountName}-private-b"
        - Key: Tier
          Value: private

  TgwA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${AccountName}-tgw-a"
        - Key: Tier
          Value: tgw

  TgwB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${AccountName}-tgw-b"
        - Key: Tier
          Value: tgw

  PrivateRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${AccountName}-private-rt"

  AssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRt
      SubnetId: !Ref PrivateA

  AssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRt
      SubnetId: !Ref PrivateB

  # ------------------------------------------------------------
  # KHONG CO INTERNET GATEWAY, KHONG CO NAT
  #
  # Khong phai quen. Duong ra Internet di qua egress VPC tap trung:
  # spoke -> TGW -> security VPC (thanh tra) -> egress VPC -> NAT.
  #
  # Mot IGW o day la mot duong vong qua toan bo lop thanh tra, va no
  # se khong bao gio hien ra trong log cua firewall - vi goi tin
  # khong bao gio di qua do.
  #
  # network_lock SCP chan viec tao IGW trong account workload.
  # ------------------------------------------------------------

  # ------------------------------------------------------------
  # NHAN LOI MOI RAM - chay TRONG account nay
  #
  # Trien khai nay chia se TGW bang external principals (duong vong
  # cua loi 56), nen moi account moi nhan mot loi moi RAM o trang
  # thai PENDING. Loi moi chi chap nhan duoc TU BEN TRONG account
  # duoc moi - management khong bam ho duoc.
  #
  # Truoc day do la mot buoc tay: ./accept-ram.sh. Buoc tay nam giua
  # mot quy trinh tu dong la buoc se bi quen, va khi quen thi
  # Attachment ben duoi hong voi:
  #
  #   Transit Gateway tgw-xxx was deleted or does not exist
  #
  # mot cau khong nhac gi toi RAM.
  #
  # Dat viec do o DAY thay vi them mot stage vao pipeline: stack nay
  # chay bang role cua StackSet trong chinh account dich, nen no
  # khong doi hoi pipeline duoc quyen assume vao account nao ca. Mot
  # stage pipeline thi phai co sts:AssumeRole vao
  # OrganizationAccountAccessRole cua MOI account moi - tuc quyen
  # admin toan to chuc cho mot duong tu dong.
  #
  # Ham KHONG chi nhan loi moi roi bao xong. No hoi lai
  # DescribeTransitGateways cho toi khi THAY TGW. Ly do:
  #   - trien khai dung RAM chia se trong to chuc (khong co loi moi)
  #     van chay dung, vi dieu kien la "thay TGW", khong phai "da
  #     chap nhan mot loi moi";
  #   - va "da bam chap nhan" khac "TGW da dung duoc" - giua hai cai
  #     do co mot khoang tre, dung khoang tre lam hong Attachment.
  # ------------------------------------------------------------

  RamRole:
    Type: AWS::IAM::Role
    Condition: DoRam
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: nhan-loi-moi-ram
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ram:GetResourceShareInvitations
                  - ram:AcceptResourceShareInvitation
                  - ec2:DescribeTransitGateways
                  # Doc DNS profile de biet share da toi noi chua.
                  # Chi doc - stack khong sua gi cua account mang.
                  - route53profiles:GetProfile
                  - route53profiles:ListProfiles
                Resource: "*"

  RamFn:
    Type: AWS::Lambda::Function
    Condition: DoRam
    DependsOn: RamRole
    Properties:
      FunctionName: !Sub "${ProjectName}-${AccountName}-nhan-ram"
      Handler: index.handler
      Runtime: python3.12
      # Phai LON HON WaitSeconds cua custom resource, neu khong ham bi
      # cat giua chung va CloudFormation cho het mot gio moi bo cuoc.
      Timeout: 600
      Role: !GetAtt RamRole.Arn
      Code:
        # KHONG dung `import cfnresponse`: python3.12 khong co san
        # module do, va thieu no thi ham chet luc KHOI TAO - truoc khi
        # vao try - nen khong nhanh nao gui duoc phan hoi. Stack treo
        # CREATE_IN_PROGRESS mot tieng. Tu gui bang urllib thi khong
        # phu thuoc gi ngoai thu vien chuan.
        ZipFile: |
          import json, time, urllib.request, boto3

          def send(event, ctx, status, data):
              # In truoc khi gui: neu urlopen hong thi it ra log con
              # giu duoc ket qua.
              print('KET QUA %s: %s' % (status, data.get('Result', '')))
              # `Reason` PHAI mang chan doan, khong phai mot loi moi doc
              # log.
              #
              # CloudFormation chi hien `Reason` trong stack event, va
              # do la thu Terraform in ra khi stack instance hong. Ban
              # dau cho nay ghi "Xem CloudWatch log: <stream>" va nhet
              # chan doan vao `Data` - nen nguoi doc loi nhan duoc mot
              # loi chi dan thay vi nguyen nhan, va con phai assume role
              # vao account dich moi doc duoc log.
              #
              # CFN gioi han truong nay ~1024 byte, nen cat con 900 va
              # GIU CA `Data` cho ai muon doc day du.
              ly_do = str(data.get('Result', status))[:900]
              body = json.dumps({
                  'Status': status,
                  'Reason': ly_do + ' | log: ' + ctx.log_stream_name,
                  'PhysicalResourceId': ctx.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT')
              req.add_header('content-type', '')
              req.add_header('content-length', str(len(body)))
              urllib.request.urlopen(req)

          def why(e):
              # type(e).__name__ tra ve "ClientError" cho MOI loi cua
              # AWS - AccessDenied, tham so sai, dich vu chua bat deu
              # in ra mot tu. Ma loi that nam trong response.
              try:
                  return e.response['Error']['Code']
              except Exception:
                  return type(e).__name__

          def cho_loi_moi(ram, ten_can):
              nhan = []
              tok = None
              while True:
                  kw = {'maxResults': 100}
                  if tok:
                      kw['nextToken'] = tok
                  r = ram.get_resource_share_invitations(**kw)
                  for i in r.get('resourceShareInvitations', []):
                      if i.get('status') != 'PENDING':
                          continue
                      if ten_can and i.get('resourceShareName') not in ten_can:
                          continue
                      arn = i['resourceShareInvitationArn']
                      try:
                          ram.accept_resource_share_invitation(
                              resourceShareInvitationArn=arn)
                          nhan.append('OK:' + i.get('resourceShareName', '?'))
                      except Exception as e:
                          # InvitationAlreadyAcceptedException xay ra khi
                          # hai lan chay dam nhau. Khong phai loi.
                          nhan.append(why(e) + ':' + i.get('resourceShareName', '?'))
                  tok = r.get('nextToken')
                  if not tok:
                      return nhan

          def thay_tgw(ec2, tgw):
              r = ec2.describe_transit_gateways(TransitGatewayIds=[tgw])
              return r['TransitGateways'][0]['State']

          def thay_profile(r53, pid):
              # Profile duoc chia se qua RAM chi hien ra o account nay
              # SAU khi loi moi duoc nhan. Truoc do get_profile bao
              # ResourceNotFoundException - dung cai ma
              # AWS::Route53Profiles::ProfileAssociation gap va bao
              # thanh "[RSLVR-05007] Can't find the resource with ID".
              r = r53.get_profile(ProfileId=pid)
              return r['Profile']['Status']

          def handler(event, ctx):
              try:
                  if event['RequestType'] == 'Delete':
                      # Khong the huy nhan mot loi moi da nhan, va cung
                      # khong nen: tai nguyen co the dang duoc dung boi
                      # thu khac trong account nay.
                      send(event, ctx, 'SUCCESS', {'Result': 'DELETE:khong-lam-gi'})
                      return

                  p = event['ResourceProperties']
                  tgw = p.get('TransitGatewayId', '')
                  pid = p.get('DnsProfileId', '')
                  ten_can = set(
                      n.strip() for n in p.get('ShareNames', '').split(',') if n.strip())
                  han = time.time() + int(p.get('WaitSeconds', '240'))

                  if not tgw and not pid:
                      send(event, ctx, 'SUCCESS',
                           {'Result': 'SKIP:khong-dung-tai-nguyen-chia-se-nao'})
                      return

                  ram = boto3.client('ram')
                  ec2 = boto3.client('ec2')
                  r53 = boto3.client('route53profiles')
                  dau_vet = []

                  while True:
                      try:
                          dau_vet += cho_loi_moi(ram, ten_can)
                      except Exception as e:
                          dau_vet.append('loi-moi:' + why(e))

                      # DIEU KIEN THAT: MOI tai nguyen duoc khai deu
                      # nhin thay duoc. Khong phai "da bam nhan loi
                      # moi".
                      #
                      # Phai kiem CA HAI. Ban dau cho nay chi hoi TGW,
                      # va DnsProfile - khong phu thuoc gi nen duoc tao
                      # song song - hong voi RSLVR-05007 trong khi ham
                      # bao SUCCESS.
                      xong = []
                      thieu = []

                      if tgw:
                          try:
                              tt = thay_tgw(ec2, tgw)
                              if tt == 'available':
                                  xong.append('tgw')
                              else:
                                  thieu.append('tgw:' + tt)
                          except Exception as e:
                              thieu.append('tgw:' + why(e))

                      if pid:
                          try:
                              tt = thay_profile(r53, pid)
                              if tt in ('COMPLETE', 'AVAILABLE', 'CREATE_COMPLETE'):
                                  xong.append('profile')
                              else:
                                  thieu.append('profile:' + tt)
                          except Exception as e:
                              thieu.append('profile:' + why(e))

                      # IN RA LOG.
                      #
                      # Truoc day ham chi gui chan doan trong response
                      # body, va CloudFormation nhet no vao `Data` -
                      # truong khong hien o dau. `Reason` thi ghi "Xem
                      # CloudWatch log", va CloudWatch KHONG CO GI vi
                      # khong co lenh print nao. Nguoi doc loi duoc chi
                      # sang mot cho trong.
                      print('vong: xong=%s thieu=%s con %ds'
                            % (xong, thieu, int(han - time.time())))

                      if not thieu:
                          send(event, ctx, 'SUCCESS', {'Result': (
                              'OK:' + ','.join(xong) + ' ' + ','.join(dau_vet[-3:]))})
                          return

                      dau_vet += thieu

                      if time.time() >= han:
                          send(event, ctx, 'FAILED', {'Result': (
                              'HET GIO. Con thieu: ' + '; '.join(thieu)
                              + ' | Dau vet: ' + '; '.join(dau_vet[-6:])
                              + ' | Hai nguyen nhan: (1) tai nguyen chua duoc chia'
                              + ' se toi account nay - chay lai stage chia se TGW;'
                              + ' (2) ShareNames khong khop ten resource share'
                              + ' that, nen loi moi khong duoc nhan.')})
                          return

                      time.sleep(10)

              except Exception as e:
                  # Bat MOI thu: mot ngoai le khong bat duoc nghia la
                  # CloudFormation khong nhan duoc phan hoi nao va treo
                  # mot tieng dong ho.
                  send(event, ctx, 'FAILED', {'Result': 'NGOAI LE:' + why(e)})

  NhanRam:
    Type: AWS::CloudFormation::CustomResource
    Condition: DoRam
    DependsOn: RamFn
    Properties:
      ServiceToken: !GetAtt RamFn.Arn
      TransitGatewayId: !If [DoAttach, !Ref TransitGatewayId, ""]
      DnsProfileId: !If [DoDns, !Ref DnsProfileId, ""]
      ShareNames: !Ref RamShareNames
      WaitSeconds: !Ref RamWaitSeconds

  Attachment:
    Type: AWS::EC2::TransitGatewayAttachment
    Condition: DoAttach
    # Khong tao attachment truoc khi TGW that su nhin thay duoc trong
    # account nay. Thieu dong nay thi stack hong voi "Transit Gateway
    # ... was deleted or does not exist" - mot cau doc nhu TGW khong
    # ton tai, trong khi no ton tai va chi la chua toi day.
    DependsOn: NhanRam
    Properties:
      TransitGatewayId: !Ref TransitGatewayId
      VpcId: !Ref Vpc
      SubnetIds:
        - !Ref TgwA
        - !Ref TgwB
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-tgwa-${AccountName}"

  # Route mac dinh vao TGW. DependsOn Attachment, khong phai vi thu
  # tu dep ma vi route tro toi mot attachment chua ton tai thi
  # CloudFormation bao "invalid transit gateway ID" - mot thong bao
  # noi ve ID trong khi van de la thoi diem.
  DefaultToTgw:
    Type: AWS::EC2::Route
    Condition: DoAttach
    DependsOn: Attachment
    Properties:
      RouteTableId: !Ref PrivateRt
      DestinationCidrBlock: 0.0.0.0/0
      TransitGatewayId: !Ref TransitGatewayId

  # ------------------------------------------------------------
  # VPC ENDPOINT
  #
  # Gateway endpoint (S3, DynamoDB) phai nam TRONG tung VPC - chung
  # lam viec o tang route table, khong phai tang DNS, nen khong the
  # dung chung. Bu lai chung MIEN PHI va bo duoc phi NAT cho luu
  # luong S3.
  #
  # Interface endpoint thi NGUOC LAI: dat tap trung o security VPC,
  # spoke goi toi qua TGW va phan giai bang DNS profile ben duoi.
  # Mot ENI moi AZ moi dich vu la ~$0.01/gio - nhan len theo so
  # account thi khong ai tra noi.
  # ------------------------------------------------------------

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRt

  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRt

  # DNS tap trung.
  #
  # Profile mang theo CA PHZ noi bo LAN cac PHZ cua interface
  # endpoint. Gan mot lan la VPC nay phan giai duoc ten cua spoke
  # khac VA tro duoc ten AWS vao endpoint noi bo.
  #
  # Khong co no thi ssm.<region>.amazonaws.com phan giai ra IP cong
  # khai, luu luong di vong ra Internet, va endpoint tap trung van
  # tinh tien ma khong ai dung.
  DnsProfile:
    Type: AWS::Route53Profiles::ProfileAssociation
    Condition: DoDns
    # Cung ly do voi Attachment: profile den tu account mang qua RAM,
    # va truoc khi loi moi duoc nhan thi no khong ton tai o day.
    DependsOn: NhanRam
    Properties:
      Name: !Sub "${ProjectName}-${AccountName}"
      ProfileId: !Ref DnsProfileId
      ResourceId: !Ref Vpc

  # Security group nen. KHONG mo gi ra Internet - dai duy nhat duoc
  # phep goi vao la mang noi bo, va luu luong do da di qua firewall
  # truoc khi toi day.
  BaselineSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Baseline cho ${AccountName} - chi tu mang noi bo"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTP tu mang noi bo
          CidrIp: !Ref InternalSupernet
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
        - Description: HTTPS tu mang noi bo
          CidrIp: !Ref InternalSupernet
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
      SecurityGroupEgress:
        - Description: Ra ngoai qua TGW
          CidrIp: 0.0.0.0/0
          IpProtocol: "-1"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${AccountName}-baseline"

Outputs:
  VpcId:
    Value: !Ref Vpc
  PrivateSubnets:
    Value: !Sub "${PrivateA},${PrivateB}"
  BaselineSecurityGroup:
    Value: !GetAtt BaselineSg.GroupId
  AttachmentId:
    Condition: DoAttach
    Value: !Ref Attachment
    Description: Dan ID nay vao spoke_attachments cua layer network
