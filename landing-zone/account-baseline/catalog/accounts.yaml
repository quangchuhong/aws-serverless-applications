# ==============================================================
# YEU CAU TAO ACCOUNT - doc 09
#
# Mot khoi = mot account. Them khoi, mo PR, merge, apply.
#
# --------------------------------------------------------------
# GAN NHU KHONG HOAN TAC DUOC. Doc het truoc khi them mot khoi.
#
#   - Account KHONG XOA duoc, chi DONG duoc, va dong xong phai cho
#     90 ngay moi bien mat khoi to chuc.
#   - Email la DUY NHAT VINH VIEN o pham vi AWS toan cau. Dong
#     account roi cung KHONG dung lai duoc email do.
#   - Go mot khoi khoi file nay KHONG dong account: layer nay dat
#     close_accounts_on_destroy = false, nen destroy chi go khoi
#     state. Do la hanh vi co chu dich.
#
# Nghia la: mot chu so go nham trong `email` khong sua duoc. Do la
# ly do lint.sh doi ticket va doi email theo dung mot khuon.
# --------------------------------------------------------------
# TRUONG
#
#   name         BAT BUOC  ten account. Chu thuong, so, gach ngang.
#                          Cung la khoa trong state - DOI TEN LA
#                          TAO ACCOUNT MOI, khong phai doi ten cai cu
#   email        BAT BUOC  hop thu goc cua account. Dung plus-address
#                          de khong can nhieu hop thu that:
#                            ban+lz-app-staging@gmail.com
#   ou           BAT BUOC  TEN OU, khong phai ID. Giai thanh parent_id
#                          qua var.ou_ids - lay tu layer organization
#   scope        BAT BUOC  analytics | nonprod | prod | none
#                          "none" = account ha tang (network, security,
#                          log archive), chi nhan permission set "all"
#   environment  BAT BUOC  dev | staging | prod | sandbox (doc 11)
#   owner        BAT BUOC  email doi chiu trach nhiem
#   cost_center  BAT BUOC  ma phong ban chiu chi phi. MA, khong phai ten
#   ticket       BAT BUOC  phe duyet. Mot account la cam ket dai han
#   note                   mot cau tieng nguoi
#
#   network                Bo trong = account KHONG noi vao luoi mang.
#                          Dung cho account ha tang khong can VPC.
#
#                          VOI ACCOUNT HOAN TOAN MOI: DE TRONG O LAN
#                          APPLY DAU TIEN. TGW chua duoc chia se cho
#                          mot account chua ton tai, va CloudFormation
#                          se hong voi mot loi noi ve "ID TGW khong hop
#                          le" - mot cau noi ve ID trong khi van de la
#                          quyen nhin thay. Them khoi nay o lan apply
#                          THU HAI, sau khi account da nhan loi moi RAM.
#                          Nam buoc day du: xem README muc "Nam buoc,
#                          ba layer, va khong gop duoc".
#     vpc_cidr   BAT BUOC  theo bang cap phat o doc 17 muc 3:
#                            NonProd    10.10.0.0 - 10.13.255.255
#                            Prod       10.20.0.0 - 10.23.255.255
#                            Analytics  10.30.0.0 - 10.33.255.255
#                            Sandbox    10.60.0.0 - 10.63.255.255
#     attach_tgw           mac dinh true. false = tao VPC nhung khong
#                          noi vao TGW - dung cho sandbox
#     attach_dns           mac dinh BANG attach_tgw, khong phai true.
#                          Route 53 Profile tro ten dich vu AWS vao
#                          interface endpoint o security VPC
#                          (10.1.0.0/16); VPC khong noi TGW khong co
#                          duong toi do, nen gan profile o do la bien
#                          moi loi goi API thanh mot dia chi khong di
#                          toi duoc - te hon IP cong khai.
#                          Chi dat true khi VPC duoc noi bang cach khac.
#
# --------------------------------------------------------------
# VI SAO `ou` LA TEN CHU KHONG PHAI ID
#
# ou-abc1-x9y8z7w6 go nham mot ky tu van la mot chuoi hop le. Nhung
# no tro vao mot OU khac - hoac khong OU nao - va Terraform bao mot
# loi API khong nhac gi toi viec ban go nham.
#
# Ten thi lint.sh doi chieu duoc voi danh sach OU that va dung lai
# kem danh sach ten hop le. Cung ly do voi viec khai app bang ten
# chu khong phai CIDR o lop ops.
# ==============================================================

accounts:
  # ============================================================
  # DANG O BUOC 4/5 - xem README muc "Nam buoc, ba layer".
  #
  #   [x] 1. tao account            598122632665 / 913051689123 / 792207721718
  #   [x] 2. share_tgw_with_accounts o layer network
  #   [x] 3. account thay share quh11-net-tgw
  #   [ ] 4. khoi `network:` duoi day - apply layer nay
  #   [ ] 5. layer network apply lai de noi attachment vao rtb-spokes
  #
  # Buoc 5 KHONG bo duoc: attachment hien ra o account network, layer
  # nay khong voi toi. Bo qua thi VPC ton tai, attachment ton tai o
  # trang thai available, va khong goi tin nao di dau ca.
  # ============================================================

  - name: app-uat
    email: quang.hong.0991+lz-app-uat@gmail.com
    ou: NonProd
    scope: nonprod
    environment: staging
    owner: quang.hong.0991@gmail.com
    cost_center: CC-1042
    ticket: ACC-2026-001
    note: Moi truong UAT - account nonprod dau tien tao bang catalog
    network:
      vpc_cidr: 10.12.0.0/16

  - name: app-payments-prod
    email: quang.hong.0991+lz-app-payments-prod@gmail.com
    ou: Prod
    scope: prod
    environment: prod
    owner: quang.hong.0991@gmail.com
    cost_center: CC-4021
    ticket: ACC-2026-002
    note: Workload thanh toan - prod. SCP prod_guard ap dung o OU nay
    network:
      vpc_cidr: 10.21.0.0/16

  - name: sandbox-thu-nghiem
    email: quang.hong.0991+lz-sandbox-01@gmail.com
    ou: Sandbox
    scope: nonprod
    environment: sandbox
    owner: quang.hong.0991@gmail.com
    cost_center: CC-0000
    ticket: ACC-2026-003
    note: Sandbox - KHONG noi TGW, tu lo duong ra Internet
    # Khong noi TGW nen cung khong lay DNS tap trung: attach_dns mac
    # dinh bang attach_tgw. Buoc 2 va 3 KHONG can cho account nay.
    network:
      vpc_cidr: 10.60.0.0/16
      attach_tgw: false

