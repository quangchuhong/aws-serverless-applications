# ==============================================================
# KHAI BAO NOI LONG CO CHU DICH - FILE DUNG MOT LAN
#
# gate.py doc file nay khi buildspec thay no trong thu muc layer. Moi muc
# la mot cau tra loi cho dung mot cau hoi: "viec noi long nay CO NEN xay
# ra khong". Do la cau ma khong lop nao khac tra loi duoc - `plan` chi noi
# CAI GI doi, FAIL_ON_DESTROY chi noi BAO NHIEU.
#
# --------------------------------------------------------------
# XOA FILE NAY SAU KHI APPLY XONG. KHONG PHAI "nen", LA "PHAI".
#
# gate.py coi mot khai bao con lai sau khi thay doi da di qua la CANH BAO:
#
#   "khai bao noi long cho <dia chi> KHONG dung toi - ban plan khong noi
#    long o day. Xoa no di: mot khai bao con lai la mot cua mo bo ngo cho
#    lan sau."
#
# Va buildspec chay gate.py voi --strict, o do CANH BAO cung lam stage DO.
# Nen quy trinh la bon nhip, khong phai ba:
#
#   1. push thay doi          -> stage do: "NOI ma khong khai bao"
#   2. them file nay          -> stage qua, apply
#   3. XOA file nay           -> stage qua
#   4. neu quen buoc 3        -> lan chay SAU do, va thong bao noi ro
#
# Nhip 4 la co y: mot cua mo bo ngo tu no lam pipeline do, chu khong nam
# im cho toi khi co nguoi loi dung.
#
# --------------------------------------------------------------
# BA TRUONG DEU BAT BUOC
#
#   address      dia chi resource TRONG BAN PLAN, nguyen van ke ca ngoac
#                vuong va dau nhay. Lay tu dong `+ aws_...` cua plan, hoac
#                tu `terraform state list`.
#   ticket       so ticket - de sau nay tra duoc ve nguoi va ly do
#   reason       ly do NGHIEP VU, khong phai mo ta ky thuat. "mo cong 80"
#                la mo ta; "cong bo dich vu api-v2 cho doi tac sim" la ly do.
#   approved_by  NGUOI duyet. gate.py khong kiem duoc ten nay co that hay
#                khong - no chi bat buoc phai co MOT ten, de viec noi long
#                khong bao gio la viec khong ai nhan.
#
# Thieu bat ky truong nao: "Khai bao noi long thieu truong <ten>".
# ==============================================================

loosen:
  # ------------------------------------------------------------
  # TAO mot ingress rule la NOI - chieu nguoc voi truc giac ve `tao`
  #
  # gate.py ghi ly do o muc aws_vpc_security_group_ingress_rule:
  # "mo them mot duong vao - thay doi de nhat trong ca bang nay de bien
  # mot mang kin thanh mang ho".
  #
  # Cai dang mo o day, doc tu ban plan:
  #
  #   cidr_ipv4  10.9.100.0/23  dai NLB cua vung dem doi tac
  #   port       80             target_port, khong phai 8081
  #   dich       10.20.0.10/32  app-prod-api
  #
  # LUU Y dia chi: khoa la "<doi tac>-<dich vu>|<cidr>", va cidr o day la
  # dai THAT cua doi tac (172.16.0.0/16) chu khong phai dai NLB - do la
  # khoa cua partner_service_sources, khac voi cidr_ipv4 cua rule.
  # ------------------------------------------------------------
  # `stage` BAT BUOC o layer nay vi no co HAI stage dung chung file nay.
  #
  # Thieu dong nay thi khai bao duoc xet o CA HAI stage, va stage
  # cloudops-network - noi ban plan khong he noi long gi - se bao
  # "khai bao ... KHONG dung toi", roi --strict lam no DO. Da xay ra dung
  # nhu vay o lan chay dau: plan sach, 0 loi, va stage van do.
  - stage: cloudops-firewall
    address: aws_vpc_security_group_ingress_rule.partner_service["sim-api-v2|172.16.0.0/16"]
    ticket: TEST-9002
    reason: Cong bo dich vu api-v2 cho doi tac sim de thu duong pipeline ops-network
    approved_by: quang
